<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="news3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001830" />
      <stop offset="50%" stop-color="#00274d" />
      <stop offset="100%" stop-color="#001020" />
    </linearGradient>
    <linearGradient id="goldN3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#news3Bg)"/>
  
  <!-- Partnership / Handshake Graphics -->
  <g transform="translate(250, 90)" opacity="0.9">
    <!-- Two connecting international circles -->
    <circle cx="100" cy="110" r="70" fill="#001a33" stroke="url(#goldN3)" stroke-width="2.5"/>
    <circle cx="200" cy="110" r="70" fill="#001a33" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Connection node -->
    <line x1="100" y1="110" x2="200" y2="110" stroke="#ffffff" stroke-width="3"/>
    <circle cx="150" cy="110" r="14" fill="#c5a059"/>
    <text x="150" y="115" font-family="system-ui" font-size="14" font-weight="bold" fill="#001830" text-anchor="middle">&#10003;</text>
  </g>

  <!-- Bottom News Tag -->
  <rect y="410" width="800" height="90" fill="#001428" fill-opacity="0.9"/>
  <text x="30" y="445" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c5a059" letter-spacing="2">COOPERAÇÃO INTERNACIONAL</text>
  <text x="30" y="475" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Memorandos de Cooperação com Institutos Globais</text>
</svg>
