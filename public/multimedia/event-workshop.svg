<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ev1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021426" />
      <stop offset="50%" stop-color="#00264d" />
      <stop offset="100%" stop-color="#000d1a" />
    </linearGradient>
    <linearGradient id="goldE1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ev1Bg)"/>
  
  <!-- Academic Scopus & Research Paper Graphics -->
  <g transform="translate(250, 70)" opacity="0.9">
    <rect x="0" y="0" width="300" height="200" rx="10" fill="#001830" stroke="url(#goldE1)" stroke-width="2"/>
    <text x="30" y="50" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#c5a059">SCOPUS / WoS</text>
    <line x1="30" y1="75" x2="270" y2="75" stroke="#475569" stroke-width="1.5"/>
    <line x1="30" y1="105" x2="230" y2="105" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="30" y1="130" x2="250" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="30" y1="155" x2="190" y2="155" stroke="#94a3b8" stroke-width="1.5"/>
    
    <rect x="180" y="30" width="90" height="30" rx="6" fill="#0284c7"/>
    <text x="225" y="50" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">WORKSHOP</text>
  </g>

  <!-- Bottom Event Tag -->
  <rect y="410" width="800" height="90" fill="#001428" fill-opacity="0.9"/>
  <text x="30" y="445" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c5a059" letter-spacing="2">CAPACITAÇÃO CIENTÍFICA</text>
  <text x="30" y="475" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Metodologias Ágeis &amp; Publicações Scopus</text>
</svg>
