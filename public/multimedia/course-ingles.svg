<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a33" />
      <stop offset="50%" stop-color="#002d5a" />
      <stop offset="100%" stop-color="#001428" />
    </linearGradient>
    <linearGradient id="goldG6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#langBg)"/>
  
  <!-- Global Globe & Academic Writing Graphics -->
  <g transform="translate(260, 80)" opacity="0.9">
    <!-- Globe outline -->
    <circle cx="140" cy="130" r="110" fill="#001830" stroke="url(#goldG6)" stroke-width="2.5"/>
    <ellipse cx="140" cy="130" rx="60" ry="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="30" y1="130" x2="250" y2="130" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="60" y1="80" x2="220" y2="80" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="60" y1="180" x2="220" y2="180" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- International Badge -->
    <rect x="70" y="210" width="140" height="36" rx="18" fill="#c5a059"/>
    <text x="140" y="233" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#001830" text-anchor="middle" letter-spacing="1">IELTS / TOEFL</text>
  </g>

  <!-- Bottom Course Info Banner -->
  <rect y="410" width="800" height="90" fill="#001428" fill-opacity="0.9"/>
  <text x="30" y="445" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c5a059" letter-spacing="2">CENTRO DE ESTUDOS DE LÍNGUAS</text>
  <text x="30" y="475" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Inglês Académico &amp; Científico</text>
</svg>
