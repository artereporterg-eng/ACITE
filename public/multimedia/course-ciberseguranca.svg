<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021426" />
      <stop offset="60%" stop-color="#00264d" />
      <stop offset="100%" stop-color="#000d1a" />
    </linearGradient>
    <linearGradient id="goldG5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#secBg)"/>
  
  <!-- Cyber Shield Graphics -->
  <g transform="translate(300, 80)" opacity="0.9">
    <path d="M 100 10 L 190 45 L 190 120 C 190 180 100 230 100 230 C 100 230 10 180 10 120 L 10 45 Z" fill="#001830" stroke="url(#goldG5)" stroke-width="3.5"/>
    <!-- Padlock inside shield -->
    <rect x="70" y="110" width="60" height="50" rx="6" fill="#c5a059"/>
    <path d="M 80 110 L 80 85 C 80 70 120 70 120 85 L 120 110" fill="none" stroke="#f5d77f" stroke-width="6"/>
    <circle cx="100" cy="130" r="5" fill="#001830"/>
    <line x1="100" y1="135" x2="100" y2="148" stroke="#001830" stroke-width="3"/>
  </g>

  <!-- Bottom Course Info Banner -->
  <rect y="410" width="800" height="90" fill="#001428" fill-opacity="0.9"/>
  <text x="30" y="445" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c5a059" letter-spacing="2">PÓS-GRADUAÇÃO EXECUTIVA</text>
  <text x="30" y="475" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Cibersegurança &amp; Governação de TI</text>
</svg>
