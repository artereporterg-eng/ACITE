<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="news1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a33" />
      <stop offset="50%" stop-color="#002b4d" />
      <stop offset="100%" stop-color="#001428" />
    </linearGradient>
    <linearGradient id="goldN1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#news1Bg)"/>
  
  <!-- Conference Stage Graphics -->
  <g transform="translate(200, 70)" opacity="0.9">
    <rect x="0" y="0" width="400" height="240" rx="12" fill="#001830" stroke="url(#goldN1)" stroke-width="2"/>
    <!-- Stage lighting -->
    <polygon points="100,0 140,240 60,240" fill="#f5d77f" fill-opacity="0.15"/>
    <polygon points="300,0 340,240 260,240" fill="#f5d77f" fill-opacity="0.15"/>
    <!-- Podium -->
    <rect x="175" y="140" width="50" height="100" fill="#002855" stroke="url(#goldN1)" stroke-width="1.5"/>
    <!-- Microphone -->
    <line x1="200" y1="140" x2="200" y2="120" stroke="#ffffff" stroke-width="2"/>
    <circle cx="200" cy="115" r="5" fill="#f5d77f"/>
    <!-- Audience silhouettes -->
    <circle cx="80" cy="220" r="14" fill="#001428"/>
    <circle cx="130" cy="220" r="14" fill="#001428"/>
    <circle cx="270" cy="220" r="14" fill="#001428"/>
    <circle cx="320" cy="220" r="14" fill="#001428"/>
  </g>

  <!-- Bottom News Tag -->
  <rect y="410" width="800" height="90" fill="#001428" fill-opacity="0.9"/>
  <text x="30" y="445" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c5a059" letter-spacing="2">EVENTOS CIENTÍFICOS</text>
  <text x="30" y="475" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Conferência Internacional de IA e Inovação</text>
</svg>
