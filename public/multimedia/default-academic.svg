<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="defBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001830" />
      <stop offset="50%" stop-color="#002244" />
      <stop offset="100%" stop-color="#000e1f" />
    </linearGradient>
    <linearGradient id="goldDef" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#defBg)"/>
  
  <!-- Central Emblem -->
  <g transform="translate(400, 200)">
    <circle cx="0" cy="0" r="100" fill="#001830" stroke="url(#goldDef)" stroke-width="3"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
    <text x="0" y="25" font-family="system-ui, sans-serif" font-size="70" font-weight="900" fill="url(#goldDef)" text-anchor="middle">A</text>
  </g>

  <!-- Bottom ACITE Banner -->
  <rect y="400" width="800" height="100" fill="#001428" fill-opacity="0.95"/>
  <text x="400" y="440" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">ACITE • ACADEMIA DE CIÊNCIAS SOCIAIS E TECNOLOGIAS</text>
  <text x="400" y="468" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c5a059" text-anchor="middle" letter-spacing="1.5">ALTOS ESTUDOS E INVESTIGAÇÃO CIENTÍFICA EM ANGOLA</text>
</svg>
