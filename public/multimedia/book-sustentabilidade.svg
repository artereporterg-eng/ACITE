<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="book1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001830" />
      <stop offset="40%" stop-color="#002d5a" />
      <stop offset="100%" stop-color="#000f20" />
    </linearGradient>
    <linearGradient id="goldB1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>

  <!-- Book Cover Background -->
  <rect width="600" height="850" fill="url(#book1Bg)"/>
  
  <!-- Outer Gold Frame -->
  <rect x="30" y="30" width="540" height="790" fill="none" stroke="url(#goldB1)" stroke-width="2"/>
  <rect x="40" y="40" width="520" height="770" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Header Branding -->
  <text x="300" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#c5a059" text-anchor="middle" letter-spacing="3">ACADEMIA DE CIÊNCIAS SOCIAIS E TECNOLOGIAS</text>
  <text x="300" y="115" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">COLECÇÃO ESTUDOS ESTRATÉGICOS • VOL. I</text>

  <!-- Title Block -->
  <g transform="translate(60, 200)">
    <text x="0" y="40" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" width="480">Desenvolvimento</text>
    <text x="0" y="85" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" width="480">Sustentável e</text>
    <text x="0" y="130" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#f5d77f" width="480">Transformação Digital</text>
    <text x="0" y="175" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" width="480">em Angola</text>
    
    <text x="0" y="230" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1">Perspectivas, Inovação e Desafios Estruturais</text>
  </g>

  <!-- Central Graphic Symbol -->
  <g transform="translate(300, 560)">
    <circle cx="0" cy="0" r="70" fill="#001a33" stroke="url(#goldB1)" stroke-width="2"/>
    <path d="M -35 0 L 35 0 M 0 -35 L 0 35" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" fill="#c5a059"/>
  </g>

  <!-- Authors & ISBN Footer -->
  <g transform="translate(60, 710)">
    <line x1="0" y1="0" x2="480" y2="0" stroke="url(#goldB1)" stroke-width="1.5"/>
    <text x="0" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Prof. Doutor António Manuel &amp; Equipa ACITE</text>
    <text x="0" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">ISBN: 978-989-123-456-7 • Editora Universitária ACITE</text>
  </g>
</svg>
