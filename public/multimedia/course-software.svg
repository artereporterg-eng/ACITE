<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="softBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c38" />
      <stop offset="60%" stop-color="#002d5a" />
      <stop offset="100%" stop-color="#001428" />
    </linearGradient>
    <linearGradient id="goldG3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#softBg)"/>
  
  <!-- Code & Cloud Architecture Graphics -->
  <g transform="translate(240, 100)" opacity="0.85">
    <rect x="0" y="0" width="320" height="200" rx="10" fill="#00162d" stroke="url(#goldG3)" stroke-width="2"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="35" cy="20" r="5" fill="#eab308"/>
    <circle cx="50" cy="20" r="5" fill="#22c55e"/>
    
    <!-- Code lines -->
    <text x="30" y="70" font-family="monospace" font-size="16" fill="#38bdf8">&lt;SoftwareArchitecture&gt;</text>
    <text x="50" y="105" font-family="monospace" font-size="14" fill="#c5a059">const cloud = new Cluster();</text>
    <text x="50" y="135" font-family="monospace" font-size="14" fill="#a7f3d0">await cloud.deploySystem();</text>
    <text x="30" y="170" font-family="monospace" font-size="16" fill="#38bdf8">&lt;/SoftwareArchitecture&gt;</text>
  </g>

  <!-- Bottom Course Info Banner -->
  <rect y="410" width="800" height="90" fill="#001428" fill-opacity="0.9"/>
  <text x="30" y="445" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c5a059" letter-spacing="2">MESTRADO (MSC)</text>
  <text x="30" y="475" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Engenharia de Software &amp; Sistemas de Informação</text>
</svg>
