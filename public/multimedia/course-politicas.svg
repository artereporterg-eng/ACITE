<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="govBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a33" />
      <stop offset="50%" stop-color="#002b4d" />
      <stop offset="100%" stop-color="#001830" />
    </linearGradient>
    <linearGradient id="goldG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#govBg)"/>
  
  <!-- Civic / Governance Pillars Illustration -->
  <g transform="translate(250, 80)" opacity="0.85">
    <polygon points="150,40 20,90 280,90" fill="#001f3f" stroke="url(#goldG2)" stroke-width="2.5"/>
    <rect x="40" y="100" width="28" height="180" rx="3" fill="#002b4d" stroke="url(#goldG2)" stroke-width="1.5"/>
    <rect x="90" y="100" width="28" height="180" rx="3" fill="#002b4d" stroke="url(#goldG2)" stroke-width="1.5"/>
    <rect x="140" y="100" width="28" height="180" rx="3" fill="#002b4d" stroke="url(#goldG2)" stroke-width="1.5"/>
    <rect x="190" y="100" width="28" height="180" rx="3" fill="#002b4d" stroke="url(#goldG2)" stroke-width="1.5"/>
    <rect x="240" y="100" width="28" height="180" rx="3" fill="#002b4d" stroke="url(#goldG2)" stroke-width="1.5"/>
    <rect x="10" y="290" width="280" height="25" rx="3" fill="#001f3f" stroke="url(#goldG2)" stroke-width="2"/>
    <!-- Scales of justice or emblem in pediment -->
    <circle cx="150" cy="70" r="12" fill="#c5a059"/>
  </g>

  <!-- Bottom Course Info Banner -->
  <rect y="410" width="800" height="90" fill="#001428" fill-opacity="0.9"/>
  <text x="30" y="445" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c5a059" letter-spacing="2">DOUTORAMENTO (PHD)</text>
  <text x="30" y="475" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Políticas Públicas &amp; Desenvolvimento Social</text>
</svg>
