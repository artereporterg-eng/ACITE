<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="news2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c38" />
      <stop offset="50%" stop-color="#002d5a" />
      <stop offset="100%" stop-color="#001428" />
    </linearGradient>
    <linearGradient id="goldN2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#news2Bg)"/>
  
  <!-- Academic Graduation & Opening Graphics -->
  <g transform="translate(260, 80)" opacity="0.9">
    <!-- Academic Scroll / Diploma -->
    <rect x="20" y="40" width="240" height="150" rx="8" fill="#001830" stroke="url(#goldN2)" stroke-width="2.5"/>
    <line x1="50" y1="70" x2="230" y2="70" stroke="#f5d77f" stroke-width="2"/>
    <line x1="50" y1="100" x2="190" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="50" y1="120" x2="210" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="50" y1="140" x2="160" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Wax Seal -->
    <circle cx="210" cy="150" r="18" fill="#c5a059"/>
    <circle cx="210" cy="150" r="14" fill="#002244"/>
    <text x="210" y="155" font-family="system-ui" font-size="12" font-weight="bold" fill="#f5d77f" text-anchor="middle">A</text>
  </g>

  <!-- Bottom News Tag -->
  <rect y="410" width="800" height="90" fill="#001428" fill-opacity="0.9"/>
  <text x="30" y="445" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c5a059" letter-spacing="2">INSTITUCIONAL</text>
  <text x="30" y="475" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Abertura Solene do Ano Académico 2026/2027</text>
</svg>
