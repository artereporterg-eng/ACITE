<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gestaoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001830" />
      <stop offset="50%" stop-color="#00274d" />
      <stop offset="100%" stop-color="#001020" />
    </linearGradient>
    <linearGradient id="goldG4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#gestaoBg)"/>
  
  <!-- Growth Chart / Leadership Strategy Graphics -->
  <g transform="translate(220, 90)" opacity="0.85">
    <rect x="0" y="0" width="360" height="220" rx="12" fill="#001830" stroke="url(#goldG4)" stroke-width="2"/>
    <line x1="40" y1="180" x2="320" y2="180" stroke="#475569" stroke-width="1.5"/>
    <line x1="40" y1="40" x2="40" y2="180" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Bar charts -->
    <rect x="70" y="130" width="35" height="50" rx="4" fill="#0284c7"/>
    <rect x="130" y="100" width="35" height="80" rx="4" fill="#0284c7"/>
    <rect x="190" y="70" width="35" height="110" rx="4" fill="#0284c7"/>
    <rect x="250" y="40" width="35" height="140" rx="4" fill="url(#goldG4)"/>
    
    <!-- Trend Line -->
    <polyline points="85,120 145,90 205,60 265,30" fill="none" stroke="#f5d77f" stroke-width="3"/>
    <circle cx="265" cy="30" r="6" fill="#f5d77f"/>
  </g>

  <!-- Bottom Course Info Banner -->
  <rect y="410" width="800" height="90" fill="#001428" fill-opacity="0.9"/>
  <text x="30" y="445" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c5a059" letter-spacing="2">MESTRADO (MSC)</text>
  <text x="30" y="475" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Gestão Estratégica &amp; Liderança Organizacional</text>
</svg>
